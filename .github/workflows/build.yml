name: Compilar e testar
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      beta_release:
        description: Publicar a versão de homologação
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Compilar instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GOARCH = '386'
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags="-s -w -H windowsgui" -o dist/SifyPDV.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $nsis installer.nsi
          exit $LASTEXITCODE
      - name: Verificar instalação, perfil e desinstalação
        shell: pwsh
        run: |
          $setup = Start-Process (Resolve-Path dist/SifyPDV-Setup.exe) -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Instalação falhou: $($setup.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Sify PDV'
          $desktop = [Environment]::GetFolderPath('DesktopDirectory')
          $shortcut = Join-Path $desktop 'Sify PDV.lnk'
          if (!(Test-Path $shortcut)) { throw 'Atalho ausente' }
          $launcher = Start-Process (Join-Path $app 'SifyPDV.exe') -PassThru
          $browser = $null
          for ($i = 0; $i -lt 20 -and !$browser; $i++) {
            $browser = Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" |
              Where-Object { $_.CommandLine -like '*Sify PDV\Perfil*' -and $_.CommandLine -like '*--app=https://pdv.sifysistemas.com/*' }
            if (!$browser) { Start-Sleep -Milliseconds 500 }
          }
          if (!$browser) { throw 'O Edge não abriu o endereço com o perfil exclusivo' }
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class WindowCheck {
            [DllImport("user32.dll")] public static extern int GetWindowLongW(IntPtr window, int index);
          }
          '@
          $edge = Get-Process -Id $browser[0].ProcessId
          $borderless = $false
          for ($i = 0; $i -lt 40 -and !$borderless; $i++) {
            $edge.Refresh()
            if ($edge.MainWindowHandle -ne 0) {
              $borderless = ([WindowCheck]::GetWindowLongW($edge.MainWindowHandle, -16) -band 0x00C40000) -eq 0
            }
            if (!$borderless) { Start-Sleep -Milliseconds 500 }
          }
          if (!$borderless) { throw 'A moldura do navegador permaneceu visível' }
          if (!$edge.CloseMainWindow() -or !$launcher.WaitForExit(30000) -or $launcher.ExitCode -ne 0) {
            throw 'O controlador do PDV não encerrou junto com a janela'
          }
          $profile = Join-Path $env:LOCALAPPDATA 'Sify PDV\Perfil'
          $marker = Join-Path $profile 'teste-preservacao.txt'
          Set-Content -Path $marker -Value 'preservar'
          $uninstall = Start-Process (Join-Path $app 'Desinstalar.exe') -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path $shortcut) -or (Test-Path (Join-Path $app 'SifyPDV.exe'))) {
            throw 'Desinstalação falhou'
          }
          if ((Get-Content $marker) -ne 'preservar') { throw 'Perfil não preservado' }
      - uses: actions/upload-artifact@v5
        with:
          name: SifyPDV-Setup
          path: dist/SifyPDV-Setup.exe
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.beta_release && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: SifyPDV-Setup
      - name: Publicar versão de homologação
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0-beta.1 SifyPDV-Setup.exe \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Sify PDV para Windows 1.1.0 beta 1" \
            --notes "Abre o PDV em tela cheia e bloqueia atalhos de atualização e inspeção na janela do caixa. Mantém o perfil existente. Instalador de homologação sem assinatura digital."
